<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SpamShield AI</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 229, 255, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(124, 58, 237, 0.18),
                    transparent 35%
                ),
                #050816;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );
            background-size: 45px 45px;
            pointer-events: none;
        }

        .auth-wrapper {
            width: min(1080px, 94%);
            min-height: 650px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            overflow: hidden;
            background: rgba(9, 15, 35, 0.78);
            backdrop-filter: blur(25px);
            box-shadow:
                0 30px 100px rgba(0,0,0,0.55);
            position: relative;
            z-index: 1;
        }

        .visual-side {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background:
                linear-gradient(
                    145deg,
                    rgba(0,229,255,0.10),
                    rgba(124,58,237,0.12)
                );
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 55px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #7c3aed
                );
            font-size: 24px;
            box-shadow:
                0 0 30px rgba(0,229,255,0.3);
        }

        .brand span {
            font-size: 22px;
            font-weight: 800;
        }

        .visual-side h1 {
            font-size: clamp(38px, 5vw, 64px);
            line-height: 1.05;
            margin: 0 0 25px;
        }

        .gradient-text {
            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #8b5cf6
                );
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
        }

        .visual-side p {
            color: #9ca9c5;
            line-height: 1.8;
            max-width: 480px;
        }

        .security-orb {
            width: 190px;
            height: 190px;
            margin-top: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(0,229,255,0.35),
                    rgba(124,58,237,0.12),
                    transparent 70%
                );
            border: 1px solid rgba(0,229,255,0.3);
            box-shadow:
                0 0 70px rgba(0,229,255,0.15),
                inset 0 0 50px rgba(124,58,237,0.1);
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-14px) rotate(3deg);
            }
        }

        .form-side {
            padding: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
        }

        .form-container h2 {
            font-size: 34px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #8f9bb4;
            margin-bottom: 35px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #b8c3d9;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 16px 17px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.09);
            outline: none;
            background: rgba(255,255,255,0.045);
            color: #ffffff;
            font-size: 15px;
            transition: 0.25s;
        }

        .field input:focus {
            border-color: #00e5ff;
            box-shadow:
                0 0 0 4px rgba(0,229,255,0.08);
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            background:
                linear-gradient(
                    135deg,
                    #00b8d4,
                    #7c3aed
                );
            box-shadow:
                0 12px 35px rgba(0,229,255,0.15);
            transition: 0.25s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 18px 45px rgba(124,58,237,0.25);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .auth-message.error {
            display: block;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
        }

        .auth-message.success {
            display: block;
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.25);
            color: #86efac;
        }

        .auth-message.info {
            display: none;
        }

        .switch {
            margin-top: 25px;
            text-align: center;
            color: #7f8aa3;
            font-size: 14px;
        }

        .switch a {
            color: #00e5ff;
            text-decoration: none;
            font-weight: 700;
        }

        .back-home {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #68758f;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 800px) {

            .auth-wrapper {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .visual-side {
                padding: 40px;
                display: none;
            }

            .form-side {
                padding: 40px 25px;
            }
        }

    </style>

</head>


<body>

    <main class="auth-wrapper">

        <section class="visual-side">

            <div class="brand">

                <div class="brand-icon">
                    🛡️
                </div>

                <span>
                    SpamShield AI
                </span>

            </div>


            <h1>
                Detect.
                <span class="gradient-text">
                    Defend.
                </span>
                Secure.
            </h1>


            <p>
                AI-powered email security designed
                to identify suspicious messages,
                protect your inbox and keep your
                digital communication safer.
            </p>


            <div class="security-orb">
                🛡️
            </div>

        </section>


        <section class="form-side">

            <div class="form-container">

                <h2>
                    Welcome back
                </h2>

                <p class="subtitle">
                    Sign in to your security dashboard.
                </p>


                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <form
                    id="loginForm"
                    autocomplete="on"
                >

                    <div class="field">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Sign In
                    </button>

                </form>


                <div class="switch">

                    Don't have an account?

                    <a href="/register">
                        Create account
                    </a>

                </div>


                <a
                    href="/"
                    class="back-home"
                >
                    ← Back to SpamShield AI
                </a>

            </div>

        </section>

    </main>


    <!-- IMPORTANT:
         Flask sends the complete Firebase configuration here.
    -->

    <div
        id="spamshield-firebase-config"
        data-config="{{ firebase_config | tojson | forceescape }}"
        hidden
    ></div>
    <script>
        window.SPAMSHIELD_FIREBASE = JSON.parse(
            document.getElementById("spamshield-firebase-config").dataset.config
        );
    </script>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


    <!-- Authentication -->

    <script
        src="{{ url_for('static', filename='js/auth.js') }}"
        defer
    ></script>

</body>

</html>
