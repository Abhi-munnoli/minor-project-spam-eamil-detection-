<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SpamShield AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>window.SPAMSHIELD_FIREBASE={{ firebase_config|tojson }};</script>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container py-2">
    <a class="navbar-brand brand text-white" href="/"><span class="brand-icon">🛡️</span>SpamShield <span class="gradient-text">AI</span></a>
    <div class="d-flex gap-2 align-items-center">
      {% if session.get('uid') %}
      <a class="btn btn-ghost btn-sm" href="/dashboard">Dashboard</a>
      <button class="btn btn-ghost btn-sm logout-btn">Logout</button>
      {% else %}
      <a class="btn btn-ghost btn-sm" href="/login">Sign In</a><a class="btn btn-primary-custom btn-sm" href="/register">Get Started</a>
      {% endif %}
    </div>
  </div>
</nav>
{% block content %}{% endblock %}
<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<footer class="footer"><div class="container d-flex justify-content-between gap-3 flex-wrap"><span>© 2026 SpamShield AI</span><span>Machine Learning • Flask • Firebase</span></div></footer>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
